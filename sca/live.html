 <label class="opt"><input type="checkbox" id="live" checked><span><b>Practice mode</b>: show your consultation template ticking live, and allow hints. Untick for <b>exam mode</b>.</span></label>
 <label class="opt"><input type="checkbox" id="voice" checked><span>Mark speaks his answers aloud</span></label>
 <div class="opt" style="display:block;cursor:default"><b>Voices</b><div class="row"><label class="tiny" for="vsel-m">Mark (patient)</label><select id="vsel-m" class="vs"></select><button class="btn ghost" id="vtest" style="min-height:40px;padding:6px 12px">▶ Hear Mark</button></div>
 <div class="row"><label class="tiny" for="vsel-d">Doctor (model replay)</label><select id="vsel-d" class="vs"></select></div><p class="tiny" id="vnote" style="margin:6px 0 0"></p></div>
 <p class="tiny">How to talk: tap the microphone, say your line, tap again to send. Or type and press Enter. The 12-minute clock runs in real time.</p>
 <details class="opt" style="display:block" ${CONF.pass?"":"open"}><summary><b>Connection and voices</b></summary>
 <p class="tiny">Your passcode is the one in your sca-config.php file. It's saved in this browser only.</p>
 <div class="row"><input id="pass" type="password" placeholder="Passcode" value="${esc(CONF.pass)}" style="flex:1;font:inherit;font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)"><button class="btn ghost" id="test">Save and test</button></div>
 <div class="row"><input id="ep" type="url" value="${esc(CONF.ep)}" aria-label="Connector address" style="flex:1;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)"></div>
 <div class="tiny" id="tres"></div></details>
 <div id="cap-note"></div><button class="btn" id="go" style="width:100%;margin-top:8px">Connect the video call</button></div></div>`;
 capNote();fillVoices();bbind();
 $("vsel-m").onchange=e=>{vMark=VOICES[+e.target.value];try{localStorage.setItem("sca-vm",vMark.name)}catch(x){}};$("vsel-d").onchange=e=>{vDoc=VOICES[+e.target.value];try{localStorage.setItem("sca-vd",vDoc.name)}catch(x){}};
 $("vtest").onclick=()=>tts&&tts.speak("The nurse says my blood pressure's still high. I'm on three tablets, I don't get it.");
 $("test").onclick=async()=>{try{localStorage.setItem("sca-pass",$("pass").value.trim());localStorage.setItem("sca-ep",$("ep").value.trim())}catch(e){}$("tres").textContent="Testing…";
  try{const r=await sample("Reply with just the word OK.",{modelTier:"quick"});$("tres").textContent=/ok/i.test(r.text)?"Connected. Claude is ready.":"Connected, but got an unexpected reply."}catch(e){$("tres").textContent=e.code==="not_granted"?"Wrong passcode.":e.code==="network"?"Can't reach the connector. Check the address and that the PHP file is uploaded.":"Error: "+(e.message||e.code)}capNote()};timer=setInterval(()=>{r--;$("rc").textContent=`${Math.floor(r/60)}:${String(r%60).padStart(2,"0")}`;if(r<=0)start()},1000);$("go").onclick=start}

/* ---------------- consultation ---------------- */
const AV=`<svg viewBox="0 0 640 340" id="av" role="img" aria-label="Mark on a video call in his van"><defs><linearGradient id="sk" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#9db4c9"/><stop offset="1" stop-color="#dbe3ea"/></linearGradient></defs><rect width="640" height="340" fill="#3a3e48"/><rect x="26" y="18" width="588" height="180" rx="18" fill="url(#sk)"/><rect x="26" y="140" width="588" height="58" fill="#8b949d"/><rect x="60" y="112" width="120" height="48" fill="#c9533d"/><rect x="430" y="120" width="140" height="40" fill="#e6e6e6"/><rect y="238" width="640" height="102" fill="#2a2e37"/><circle cx="560" cy="290" r="66" fill="none" stroke="#1d2027" stroke-width="16"/><path d="M190 340c0-68 50-104 130-104s130 36 130 104z" fill="#e36b1e"/><path d="M226 300h188" stroke="#d9d9d9" stroke-width="6"/><rect x="296" y="192" width="48" height="48" rx="14" fill="#d9a07b"/><ellipse cx="320" cy="145" rx="62" ry="72" fill="#e3ad88"/><path d="M258 126c0-48 30-66 62-66s62 18 62 66c-10-25-30-33-62-33s-52 8-62 33z" fill="#8b8f96"/><ellipse cx="260" cy="150" rx="9" ry="15" fill="#d9a07b"/><ellipse cx="380" cy="150" rx="9" ry="15" fill="#d9a07b"/><path id="bl" d="M285 124q14-8 26-2" stroke="#5d5f66" stroke-width="5" fill="none" stroke-linecap="round"/><path id="br" d="M329 122q12-6 26 2" stroke="#5d5f66" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="298" cy="144" r="5" fill="#222"/><circle cx="342" cy="144" r="5" fill="#222"/><path d="M320 146l-6 24h10" stroke="#c48e6c" stroke-width="3" fill="none"/><path id="lip" d="M298 188q22 4 44 0" stroke="#8c4a3c" stroke-width="4" fill="none" stroke-linecap="round"/><ellipse class="mouth" cx="320" cy="190" rx="11" ry="4" fill="#6b2e28" opacity="0"/></svg>`;
function start(){clearInterval(timer);S.live=$("live").checked;speechOn=$("voice").checked;
 $("app").innerHTML=`<div class="g2"><div><div class="call">${AV}<div class="hud"><span class="pill">● Video · Mark</span><span class="pill" id="cp"><b id="clk">12:00</b> left</span></div><div class="cap" id="cap">Connected. Mark is waiting.</div></div>
 <div class="mood">Mark: <div class="mb"><div id="mbar"></div></div><span id="mtx"></span></div>
 <div class="say"><button class="mic" id="mic" aria-label="Speak"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><textarea id="tx" placeholder="Say or type what you'd say to Mark…" aria-label="Your words"></textarea></div>
 <div class="row tiny"><label for="vsel-c">Mark's voice</label><select id="vsel-c" class="vs" style="max-width:260px"></select></div>
 <div class="row"><button class="btn" id="send">Send</button><button class="btn ghost" id="hintb">Stuck? Hint</button><button class="btn ghost" id="end">End consultation</button><span class="tiny" id="st"></span></div>
 <div id="hint"></div><div class="tr" id="tr"></div></div>
 <div>${boardHTML("My notes board")}<div class="card" style="margin-top:14px"><h2>What you've found</h2><ul class="clues" id="clues"><li class="none">What Mark tells you collects here.</li></ul>
 <div class="tpl ${S.live?"":"hide"}" id="tpl"></div><p class="tiny ${S.live?"hide":""}">Exam mode: your template and hints are hidden until the debrief.</p><div id="cap-note"></div></div></div></div>`;
 capNote();fillVoices();bbind();$("vsel-c").onchange=e=>{vMark=VOICES[+e.target.value];try{localStorage.setItem("sca-vm",vMark.name)}catch(x){}};if(!S.live)$("hintb").classList.add("hide");
 $("send").onclick=send;$("tx").onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send()}};$("mic").onclick=micToggle;$("end").onclick=finish;$("hintb").onclick=hint;
 if(!dict)$("mic").classList.add("hide");if(!CONF.pass)sys("Not connected: go back and set your passcode.");
 S.t0=Date.now();timer=setInterval(tick,250);mood();tpl();sys("Call connected")}
function tick(){S.left=Math.max(0,720-Math.round((Date.now()-S.t0)/1000));const m=Math.floor(S.left/60),s=String(S.left%60).padStart(2,"0");if($("clk")){$("clk").textContent=`${m}:${s}`;$("cp").classList.toggle("low",S.left<=120)}if(S.left<=0&&!S.over){S.over=true;sys("Time's up. The call ends.");setTimeout(finish,1200)}}
function sys(t){$("tr").insertAdjacentHTML("beforeend",`<div class="ln sys">${esc(t)}</div>`);$("tr").scrollTop=1e6}
function line(who,t){$("tr").insertAdjacentHTML("beforeend",`<div class="ln ${who}">${esc(t)}</div>`);$("tr").scrollTop=1e6}
function mood(){const m=Math.max(0,Math.min(8,S.mood)),b=$("mbar");if(!b)return;b.style.width=m/8*100+"%";b.style.background=m>=5?"var(--teal)":m>=3?"var(--amber)":"var(--red)";$("mtx").textContent=m>=6?"Engaged":m>=4?"Relaxed":m>=2?"Guarded":"Frustrated";
 const lip=$("lip");if(lip){lip.setAttribute("d",m>=5?"M298 186q22 14 44 0":m>=3?"M298 190q22 4 44 0":"M298 194q22 -10 44 0");$("bl").setAttribute("d",m>=3?"M285 124q14-8 26-2":"M285 118q14 2 26 8");$("br").setAttribute("d",m>=3?"M329 122q12-6 26 2":"M329 126q12-6 26-8")}}
function talking(on){const a=$("av");if(!a)return;a.classList.toggle("talk",on);a.querySelector(".mouth").setAttribute("opacity",on?"1":"0");$("lip").setAttribute("opacity",on?"0":"1")}
function tpl(){if(!$("tpl"))return;$("tpl").innerHTML=STAGES.map(([n,ks])=>`<h3>${esc(n)}</h3>${ks.map(k=>`<span class="${S.tags.has(k)?"y":""}">${esc(TAGS[k])}</span>`).join("")}`).join("")+(S.bad.length?`<h3>Watch out</h3>${[...new Set(S.bad)].map(k=>`<span class="x">${esc(TAGS[k])}</span>`).join("")}`:"")}
function clues(){const c=$("clues");if(!S.clues.size)return;c.innerHTML=[...S.clues].map(k=>`<li>${esc(CLUES[k]||k)}</li>`).join("")}
function hint(){const miss=STAGES.flatMap(s=>s[1]).find(k=>!S.tags.has(k));S.hints++;$("hint").innerHTML=`<div class="hint"><b>Hint ${S.hints}:</b> ${esc(miss?HINTS[miss]||TAGS[miss]:"You've covered the template. Close well.")}</div>`}

/* mic */
function micToggle(){if(!dict)return;if(listening){dict.stop().catch(()=>{}).then(()=>{if($("tx").value.trim())send()});return}
 try{if(tts)tts.stop()}catch(e){}
 dict.onPartial(({text})=>{$("st").textContent="Hearing: "+text});
 dict.onFinal(({text})=>{const t=$("tx");t.value=(t.value?t.value+" ":"")+text;$("st").textContent=""});
 dict.onState(({state})=>{listening=state==="listening";$("mic").classList.toggle("on",listening);$("st").textContent=listening?"Listening… tap again to send":""});
 dict.start().catch(e=>{$("st").textContent=e&&e.code==="not_granted"?"Microphone not allowed: type instead.":"Couldn't start the microphone."})}

/* turn */
function parse(t){const m=String(t).match(/\{[\s\S]*\}/);if(!m)throw new Error("no json");return JSON.parse(m[0])}
async function send(){const t=$("tx").value.trim();if(!t||S.busy||S.over)return;if(!sample){capNote();return}
 S.busy=true;$("send").disabled=true;$("tx").value="";line("dr",t);S.hist.push({who:"Doctor",t,at:720-S.left});$("cap").innerHTML=`<span class="load"></span> Mark is thinking…`;
 const transcript=S.hist.map(h=>`${h.who}: ${h.t}`).join("\n");
 const prompt=`${BRIEF}

CURRENT MOOD (0 frustrated … 8 fully engaged): ${S.mood}
CONSULTATION SO FAR:
${transcript}

Reply as Mark to the doctor's LAST line only. Then classify the doctor's LAST line.
Return ONLY JSON:
{"reply":"Mark's words","mood_change":-2..2,"tags":[zero or more of: ${Object.keys(TAGS).join(", ")}],"clues":[zero or more of: ${Object.keys(CLUES).join(", ")} — only facts Mark has now actually revealed in this reply]}
Tag only what the doctor's last line genuinely did. "closed_adherence" for a closed or judgemental adherence question. "jargon" for unexplained medical terms.`;
 try{const r=await sample(prompt,{modelTier:"quick",cache:false});const j=parse(r.text);
  S.mood=Math.max(0,Math.min(8,S.mood+(+j.mood_change||0)));(j.tags||[]).forEach(k=>{if(BADTAGS.includes(k))S.bad.push(k);else if(TAGS[k])S.tags.add(k)});(j.clues||[]).forEach(k=>CLUES[k]&&S.clues.add(k));
  const rep=String(j.reply||"…");S.hist.push({who:"Mark",t:rep,at:720-S.left});line("pt",rep);$("cap").textContent="Mark: "+rep;mood();tpl();clues();
  if(speechOn&&tts){talking(true);await tts.speak(rep,{voice:"rounded"}).catch(()=>{});talking(false)}else{talking(true);setTimeout(()=>talking(false),Math.min(5000,rep.length*55))}
 }catch(e){const msg=e&&e.code==="rate_limited"?"Mark needs a moment (rate limited). Try again shortly.":e&&e.code==="not_granted"?"Wrong passcode: check Connection settings.":"Mark didn't catch that. Try again.";sys(msg);$("cap").textContent=msg}
 S.busy=false;$("send").disabled=false}

/* ---------------- debrief ---------------- */
async function finish(){if(S.done)return;S.done=true;S.over=true;clearInterval(timer);try{tts&&tts.stop()}catch(e){};try{listening&&dict.stop()}catch(e){}
 const used=720-S.left;$("app").innerHTML=`<div class="card"><h2>Debrief</h2><p><span class="load"></span> The examiner is marking your consultation…</p></div>`;
 if(!S.hist.length){$("app").innerHTML=`<div class="card"><h2>No consultation to mark</h2><button class="btn" onclick="location.reload()">Start again</button></div>`;return}
 const transcript=S.hist.map(h=>`[${Math.floor(h.at/60)}:${String(h.at%60).padStart(2,"0")}] ${h.who}: ${h.t}`).join("\n");
 const prompt=`You are an experienced, fair but demanding MRCGP SCA examiner. Mark this 12-minute video consultation using the three SCA domains, each scored 0 (clear fail), 1 (fail), 2 (pass) or 3 (clear pass). Base marks only on what the doctor actually said.
CASE: Mark Hughes, 58, van driver, BP 166/98 on amlodipine, ramipril, indapamide (not reissued 2 months). Hidden: stopped indapamide (toilet on round); ibuprofen most days; dad's stroke at 62; doesn't want more tablets.
WHAT EARNS MARKS:
Data gathering and diagnosis: spotting the indapamide gap; open non-judgemental adherence question; asking about OTC drugs (finds ibuprofen); red flags for hypertensive emergency; home readings, alcohol, salt; working diagnosis of non-adherence + NSAID rather than resistant hypertension.
Clinical management (weighted more heavily): not adding a fourth drug yet; restart indapamide with a practical fix (take early); stop or swap NSAID; home BP, U&E, urine ACR, ECG; target under 135/85 home and NICE step 4 (spironolactone if K+ ≤4.5) if still high; specific safety-net (999 symptoms; 180/120 same day); follow-up 2–3 weeks.
Relating to others: rapport and identity/privacy checks on video; ideas, concerns, expectations; thanking for disclosure without blame; linking explanation to dad's stroke and "no more tablets"; shared decision; plain language; teach-back.
Common errors: closed "Are you taking your tablets?"; missing ibuprofen; lecturing; adding spironolactone now; jargon; vague safety-net.
Time used: ${Math.floor(used/60)} min ${used%60} s of 12. Hints used: ${S.hints}.
DOCTOR'S WRITTEN HYPOTHESES (from reading time and the call): ${(S.board&&S.board.h)||"(none written)"}
DOCTOR'S WRITTEN NOTES: ${(S.board&&S.board.n)||"(none written)"}
TRANSCRIPT:
${transcript}

Return ONLY JSON:
{"DG":{"score":0-3,"did":["..."],"missed":["..."]},"CM":{"score":0-3,"did":["..."],"missed":["..."]},"RTO":{"score":0-3,"did":["..."],"missed":["..."]},"better":[{"yours":"exact doctor line from transcript","better":"a stronger phrasing","why":"short reason"}],"top_tip":"one sentence","hypotheses":"2 sentences: were the written hypotheses sensible, and which were tested or left untested in the consultation?"}
Give 2–4 "better" items, choosing the doctor's weakest lines. Keep each list item under 15 words.`;
 let j=null;try{const r=await sample(prompt,{modelTier:"complex",cache:false});j=parse(r.text)}catch(e){}
 try{const h=JSON.parse(localStorage.getItem("sca-live-htn")||"[]");if(j)h.push({d:Date.now(),s:[j.DG.score,j.CM.score,j.RTO.score]});localStorage.setItem("sca-live-htn",JSON.stringify(h.slice(-20)));S.prev=h}catch(e){}
 const GL=["Clear fail","Fail","Pass","Clear pass"],GC=["var(--red)","var(--red)","var(--amber)","var(--teal)"];
 const dm=(k,n)=>{const d=j&&j[k];if(!d)return"";const v=Math.max(0,Math.min(3,+d.score||0));return `<div class="dm"><b style="color:${GC[v]}">${n}</b><div class="n" style="color:${GC[v]}">${v}<span style="font-size:18px">/3</span></div><b>${GL[v]}</b><ul>${(d.did||[]).map(x=>`<li>${esc(x)}</li>`).join("")}${(d.missed||[]).map(x=>`<li class="m">Missed: ${esc(x)}</li>`).join("")}</ul></div>`};
 const tplDone=STAGES.map(([n,ks])=>`<h3>${esc(n)}</h3>${ks.map(k=>`<span class="${S.tags.has(k)?"y":"x"}">${S.tags.has(k)?"✓":"✗"} ${esc(TAGS[k])}</span>`).join("")}`).join("");
 $("app").innerHTML=`<div class="card"><h2>Debrief</h2><p class="tiny" style="margin-top:0">Time used ${Math.floor(used/60)}:${String(used%60).padStart(2,"0")} of 12:00 · Mark ended the call: ${esc($("mtx")?$("mtx").textContent:"")} · Hints: ${S.hints}${S.prev&&S.prev.length>1?` · Attempt ${S.prev.length}`:""}</p>
 ${j?`<div class="dom">${dm("DG","Data gathering and diagnosis")}${dm("CM","Clinical management")}${dm("RTO","Relating to others")}</div>${j.top_tip?`<div class="hint"><b>Top tip:</b> ${esc(j.top_tip)}</div>`:""}
 <h2 style="margin-top:16px">Say it better</h2><div class="bt">${(j.better||[]).map(b=>`<div><div class="y">You: “${esc(b.yours)}”</div><div class="b">Better: “${esc(b.better)}”</div><div class="tiny">${esc(b.why)}</div></div>`).join("")}</div>`:`<div class="warn">The examiner couldn't mark this time. Your template and transcript are below.</div>`}
 ${j&&j.hypotheses?`<h2 style="margin-top:16px">Your hypotheses</h2><div class="hint" style="background:var(--soft)">${esc(j.hypotheses)}</div>`:""}
 ${(S.board&&(S.board.h||S.board.n))?`<details style="margin-top:10px"><summary>Your notes board</summary><p style="white-space:pre-wrap"><b>Hypotheses:</b> ${esc(S.board.h)}</p><p style="white-space:pre-wrap"><b>Notes:</b> ${esc(S.board.n)}</p></details>`:""}
 <h2 style="margin-top:16px">Your template</h2><div class="tpl">${tplDone}</div>
 <p class="tiny">Marks are an AI examiner's training estimate, not RCGP marks. In the real SCA, clinical management carries more weight.</p>
 <div class="row"><button class="btn ghost" onclick="location.reload()">Try again</button><button class="btn" id="model">▶ Hear a model consultation</button><span class="tiny" id="mst"></span></div>
 <details style="margin-top:14px"><summary>Your full transcript</summary><div class="tr" style="max-height:none">${S.hist.map(h=>`<div class="ln ${h.who==="Doctor"?"dr":"pt"}">${esc(h.t)}</div>`).join("")}</div></details>
 <div class="tr hide" id="mtr" style="max-height:none"></div></div>`;
 $("model").onclick=playModel}
async function playModel(){const box=$("mtr");box.classList.remove("hide");box.innerHTML=MODEL.map(([w,t],i)=>`<div class="ln ${w}" id="m${i}">${esc(t)}</div>`).join("");
 if(!tts){$("mst").textContent="Voice isn't available here: read the model below.";return}
 try{tts.onLine(({id})=>{document.querySelectorAll("#mtr .ln").forEach(x=>x.style.outline="");const el=$(id);if(el){el.style.outline="3px solid var(--pur)";el.scrollIntoView({block:"nearest",behavior:"smooth"})}});
  await tts.speak(MODEL.map(([w,t],i)=>({text:t,voice:w==="dr"?"glassy":"rounded",id:"m"+i})))}catch(e){$("mst").textContent="Playback stopped."}}

reading();
}
</script>
</body>
</html>
