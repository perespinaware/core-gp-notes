<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dermatology · Road to GP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<script src="/sync.js"></script>
<style>.list .yld{display:block;color:#b7791f;font-size:15px;letter-spacing:1px;margin-top:3px}
.sortbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 12px;font-size:14px;color:var(--mut)}
.sortbar button{font:inherit;font-size:14px;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 14px;cursor:pointer}
.sortbar button[aria-pressed="true"]{background:var(--ink);color:var(--card);border-color:var(--ink)}
.sortbar .key{margin-left:auto;color:#b7791f;font-size:13px}</style>
</head>
<body data-cat="dermatology">
<header class="band cat" id="band"><div class="in">
<img class="art" src="../img/areas/dermatology.svg" alt="" width="240" height="200">
<a class="back" href="../">← Home</a>
<h1 id="h">Dermatology</h1>
<p class="lead" id="lead"></p>
</div></header>
<main><div class="in">
<ul class="list" id="list"></ul>
<p class="note">For exam revision only, based on NICE and other UK guidance at the time of writing. Not clinical advice.</p>
</div></main>
<script src="../lessons.js"></script>
<script>
{
const esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const c=CATS.find(x=>x.id===document.body.dataset.cat);
document.body.style.setProperty("--c",c.c);
const live=c.lessons.filter(l=>l[2]).length;
document.getElementById("lead").textContent=`From ${c.src} · ${c.lessons.length} topic${c.lessons.length>1?"s":""}, ${live} live`;
if(typeof PDFS!=="undefined"&&PDFS[c.id]){const p=PDFS[c.id];document.getElementById("lead").insertAdjacentHTML("afterend",`<a class="pdfbtn" href="../guides/${p[0]}" target="_blank" rel="noopener">Open the PDF guide <small>${p[1]} pages</small></a>`)}
const STAR=n=>n?`<span class="yld" title="AKT relevance: ${n} of 5" aria-label="AKT relevance ${n} of 5">${"★".repeat(n)}${"☆".repeat(5-n)}</span>`:"";
let SORT=(()=>{try{return localStorage.getItem("rtg-sort")||"guide"}catch(e){return "guide"}})();
function drawList(){const L=c.lessons.map((l,i)=>[l,i]);if(SORT==="yield")L.sort((a,b)=>(b[0][3]||0)-(a[0][3]||0)||a[1]-b[1]);
document.getElementById("list").innerHTML=L.map(([l,i])=>{
 const inner=`<span class="n">${String(i+1).padStart(2,"0")}</span><span class="t"><b>${esc(l[0])}</b><small>${esc(l[1])}</small>${STAR(l[3])}</span><span class="st ${l[2]?"live":"soon"}">${l[2]?"Live · interactive":"Coming soon"}</span>`;
 return `<li>${l[2]?`<a class="row" href="${esc(l[2])}">${inner}</a>`:`<div class="row">${inner}</div>`}</li>`}).join("");
 document.querySelectorAll("[data-sort]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.sort===SORT))}
if(c.lessons.some(l=>l[3])){const bar=document.createElement("div");bar.className="sortbar";bar.innerHTML=`<span>Order:</span><button data-sort="guide">Guide order</button><button data-sort="yield">Highest AKT yield first</button><span class="key">★★★★★ = most often tested</span>`;
 document.getElementById("list").before(bar);bar.querySelectorAll("[data-sort]").forEach(b=>b.onclick=()=>{SORT=b.dataset.sort;try{localStorage.setItem("rtg-sort",SORT)}catch(e){}drawList()})}
drawList();
}
</script>
<script src="/time.js" defer></script>
</body>
</html>
