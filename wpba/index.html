<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WPBA at a glance · Road to GP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../style.css">
<style>
:root{--c:#3d6b45;--ok:#0b8577;--warn:#c27a00;--bad:#b3263a}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:16px}
.card h2{font:800 22px/1.2 "Bricolage Grotesque",sans-serif;margin:0 0 12px}
.dates{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.dates label{display:block;font-weight:700;font-size:14px;margin-bottom:4px}
.dates input{width:100%;font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.dates .cd{font-size:14px;color:var(--mut);margin-top:4px}
.alert{border-radius:12px;padding:12px 14px;margin-bottom:16px;font-weight:700}
.alert.bad{background:color-mix(in srgb,var(--bad) 12%,var(--card));color:var(--bad);border:1px solid color-mix(in srgb,var(--bad) 35%,transparent)}
.alert.warn{background:color-mix(in srgb,var(--warn) 12%,var(--card));color:var(--warn);border:1px solid color-mix(in srgb,var(--warn) 35%,transparent)}
.alert.ok{background:color-mix(in srgb,var(--ok) 10%,var(--card));color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 35%,transparent)}
.req{display:grid;grid-template-columns:minmax(0,1fr) 92px 110px;gap:6px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.req:first-of-type{border-top:0}
.req b{display:block}.req small{color:var(--mut);font-size:13px}
.req input{width:100%;font:inherit;font-size:17px;padding:6px 8px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);text-align:center}
.bar{grid-column:1/-1;height:8px;border-radius:4px;background:var(--line);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:4px}
.bar em{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.5}
.tag{font-size:13px;font-weight:700;padding:4px 10px;border-radius:20px;text-align:center;white-space:nowrap}
.tag.ok{background:var(--ok);color:#fff}.tag.warn{background:var(--warn);color:#fff}.tag.mut{background:var(--line);color:var(--mut)}
.ticks{display:flex;gap:10px 22px;flex-wrap:wrap}
.ticks label{display:flex;gap:8px;align-items:center;font-weight:700;cursor:pointer}
.ticks input{width:20px;height:20px;accent-color:var(--ok)}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center}
.btn{display:inline-block;background:var(--c);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:700;text-decoration:none;cursor:pointer}
.yr{display:flex;gap:6px}
.yr button{font:inherit;font-weight:700;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:4px 12px;cursor:pointer}
.yr button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.req.esr{grid-template-columns:minmax(0,1fr) 170px 110px}
@media(max-width:480px){.req{grid-template-columns:minmax(0,1fr) 72px}.req .tag{grid-column:1/-1;justify-self:start}.req.esr{grid-template-columns:minmax(0,1fr) auto}.req.esr .tag{grid-column:auto}.req.esr input[type=date]{grid-column:1/-1;grid-row:2}}
</style>
<script src="/sync.js"></script>
</head>
<body>
<header class="band cat" style="--c:#3d6b45"><div class="in">
<a class="back" href="../">← Home</a>
<h1>WPBA at a glance</h1>
<p class="lead">Your numbers against the RCGP minimum for this training year. FourteenFish stays your official record: copy your totals across about once a month.</p>
</div></header>
<main><div class="in" id="app"></div></main>
<script src="data.js"></script>
<script>
{
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const fmt=d=>d.toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"});
let D=wpbaLoad(),view=null;
const cd=n=>n===null?"Not set":n<0?`${-n} days ago`:n===0?"Today":n<=60?`in ${n} days`:`in ${Math.round(n/7)} weeks`;
function draw(){const s=wpbaStatus(D),st=view||s.y.st,cur=st===s.y.st,c=((D.counts=D.counts||{})["st"+st]=D.counts["st"+st]||{});
 const rows=WPBA_REQ.map(([k,label,a,b,c3,note])=>{let req=[a,b,c3][st-1];if(req==="post")req=s.posts;const done=+c[k]||0,pace=cur?Math.floor(req*s.y.frac+1e-9):req;return {k,label,req,done,note,pace}}).filter(r=>r.req>0);
 let alert="";
 if(cur){if(s.esr!==null&&s.esr<0)alert=`<div class="alert bad">${s.nextESR.label} was due ${cd(s.esr)}. Tick it once it's done, or change its date.</div>`;
  else if(s.urgent)alert=`<div class="alert bad">ARCP ${cd(s.arcp)}: ${s.missing.length} requirement${s.missing.length!==1?"s":""} not yet met${s.ticks.some(t=>!t.ok)?" and mandatory training to confirm":""}.</div>`;
  else if(s.behind.length)alert=`<div class="alert warn">Behind pace on ${s.behind.map(r=>r.label).join(", ")}. The marker on each bar shows where you should be by now.</div>`;
  else if(s.updated)alert=`<div class="alert ok">On pace for ST${s.y.st}.</div>`}
 $("app").innerHTML=`${alert}
 <div class="card"><h2>ST${st} educational supervisor reviews</h2>
  ${wpbaESRs(D,st).map(e=>`<div class="req esr"><div><b>${e.label}</b><small>${e.custom?"Date changed by you":"Set automatically from 5 Aug"} · ${e.done?"done":cd(Math.ceil((new Date(e.date+"T00:00:00")-new Date())/864e5))}</small></div><input type="date" data-ed="${e.k}" value="${e.date}" aria-label="${e.label} date" style="font-size:15px"><label class="tag ${e.done?"ok":Math.ceil((new Date(e.date+"T00:00:00")-new Date())/864e5)<0?"warn":"mut"}" style="cursor:pointer;display:flex;gap:6px;align-items:center;justify-content:center"><input type="checkbox" data-ek="esr${e.m}" ${e.done?"checked":""} style="width:16px;height:16px;margin:0">Done</label></div>`).join("")}
  <p class="note" style="margin:8px 0 0">Before each ESR: update your PDP, and check CbDs (at least 2 per review in ST1 and ST2), case reviews and the CSR.</p></div>
 <div class="card"><h2>ARCP and posts</h2><div class="dates">
  <div><label for="arcp">Next ARCP</label><input type="date" id="arcp" value="${D.arcp||""}"><div class="cd">${cd(s.arcp)}</div></div>
  <div><label for="posts">Posts this training year</label><input type="number" id="posts" min="1" max="6" value="${s.posts}"><div class="cd">For CSRs and planning meetings</div></div>
 </div></div>
 <div class="card"><div class="foot" style="margin-bottom:6px"><h2 style="margin:0">ST${st} requirements</h2><div class="yr" role="group" aria-label="Training year">${[1,2,3].map(n=>`<button data-y="${n}" class="${n===st?"on":""}">ST${n}</button>`).join("")}</div></div>
  <p class="note" style="margin:0 0 6px">${cur?`Training year ${fmt(s.y.ys)} – ${fmt(s.y.ye)} · ${Math.round(s.y.frac*100)}% through`:st<s.y.st?"A past training year":"A future training year"}</p>
  ${rows.map(r=>{const met=r.done>=r.req,beh=cur&&r.done<r.pace,col=met?"var(--ok)":beh?"var(--warn)":"var(--c)";
   return `<div class="req"><div><b>${esc(r.label)}</b><small>${esc(r.note)}</small></div><input type="number" min="0" data-k="${r.k}" value="${c[r.k]??""}" aria-label="${esc(r.label)} done"><span class="tag ${met?"ok":beh?"warn":"mut"}">${r.done} / ${r.req}${met?" ✓":beh?" behind":""}</span>
    <div class="bar"><i style="width:${Math.min(100,r.done/r.req*100)}%;background:${col}"></i>${cur&&!met?`<em style="left:${Math.min(100,r.pace/r.req*100)}%"></em>`:""}</div></div>`}).join("")}
 </div>
 <div class="card"><h2>Mandatory training this year</h2><div class="ticks">${WPBA_TICKS.map(([k,l])=>`<label><input type="checkbox" data-t="${k}" ${c[k]?"checked":""}>${l}</label>`).join("")}</div>
  <p class="note" style="margin:10px 0 0">Add a reflective log on safeguarding in FourteenFish too.</p></div>
 <div class="foot"><a class="btn" href="https://www.fourteenfish.com/" target="_blank" rel="noopener">Open FourteenFish</a><span class="note" style="margin:0">${D.updated?`Last updated ${fmt(new Date(D.updated))}${s.stale?" · due a refresh from FourteenFish":""}`:"Not updated yet"}</span></div>
 <p class="note">Minimum numbers from the RCGP Table of Requirements, unchanged by the August 2026 WPBA changes. Always check FourteenFish and your deanery for local extras. Saved in this browser only.</p>`;
 const touch=()=>{D.updated=Date.now();wpbaSave(D)};
 $("arcp").onchange=e=>{D.arcp=e.target.value;touch();draw()};
 document.querySelectorAll("[data-ed]").forEach(i=>i.onchange=()=>{D.esrDates=D.esrDates||{};if(i.value)D.esrDates[i.dataset.ed]=i.value;else delete D.esrDates[i.dataset.ed];touch();draw()});
 document.querySelectorAll("[data-ek]").forEach(i=>i.onchange=()=>{c[i.dataset.ek]=i.checked;touch();draw()});
 $("posts").onchange=e=>{D.posts=Math.max(1,+e.target.value||2);touch();draw()};
 document.querySelectorAll("[data-k]").forEach(i=>i.onchange=()=>{c[i.dataset.k]=i.value===""?"":Math.max(0,+i.value);touch();draw()});
 document.querySelectorAll("[data-t]").forEach(i=>i.onchange=()=>{c[i.dataset.t]=i.checked;touch();draw()});
 document.querySelectorAll("[data-y]").forEach(b=>b.onclick=()=>{view=+b.dataset.y;draw()})}
draw();
}
</script>
<script src="/time.js" defer></script>
</body>
</html>
