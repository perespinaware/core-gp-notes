<style>

.stb{font-size:12px;font-weight:700;color:#8a5a00;background:color-mix(in srgb,#c28a00 16%,transparent);border-radius:10px;padding:1px 7px;white-space:nowrap}.stb.s3{color:var(--mut);background:var(--line)}

<script>
{
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAY=864e5,GAPS=[0,1,3,7,14,30,60],L="ABCDE";
const KEY="cgn-v1",SKEY="cgn-akt-settings";
const load=()=>{try{const d=JSON.parse(localStorage.getItem(KEY));return d&&d.q?d:{q:{},log:[],cases:{}}}catch(e){return {q:{},log:[],cases:{}}}};
const save=d=>{try{localStorage.setItem(KEY,JSON.stringify(d))}catch(e){}};
let SET={recall:false,pace:true,src:"all"};try{SET=Object.assign(SET,JSON.parse(localStorage.getItem(SKEY))||{})}catch(e){}
const saveSet=()=>{try{localStorage.setItem(SKEY,JSON.stringify(SET))}catch(e){}};
{const u=new URLSearchParams(location.search).get("src");if(["all","5","3","site","mine"].includes(u))SET.src=u}
const SRC_LABEL={all:"All questions",5:"★5 only",3:"★3 only",site:"Site questions only",mine:"My bank only"};
const inSrc=q=>q.gen?SET.src==="all"||SET.src==="site":SET.src==="all"?true:SET.src==="5"?q.stars===5:SET.src==="3"?q.stars===3:SET.src==="site"?!q.stars:!!q.stars;

/* ---------------- bank ---------------- */
const COLORS={};(typeof CATS!=="undefined"?CATS:[]).forEach(c=>COLORS[c.id]=c.c);COLORS.calc="#5b4fc4";COLORS.mybank="#c28a00";
let BANK=[],TOPICS=[];
const GEN={
 twobytwo(){const dz=[40,60,80,100,120,150][r(6)],nd=[300,400,600,800,900][r(5)],se=[.7,.75,.8,.85,.9,.95][r(6)],sp=[.75,.8,.85,.9,.95][r(5)];
  const a=Math.round(dz*se),c=dz-a,d=Math.round(nd*sp),b=nd-d,pct=x=>(x*100).toFixed(1)+"%";
  const M={Sensitivity:a/(a+c),Specificity:d/(b+d),"Positive predictive value":a/(a+b),"Negative predictive value":d/(c+d)};
  const ask=Object.keys(M)[r(4)],right=pct(M[ask]);const wrongs=Object.keys(M).filter(k=>k!==ask).map(k=>pct(M[k]));wrongs.push(pct(1-M[ask]));
  const opts=shuffle([right,...[...new Set(wrongs)].filter(x=>x!==right).slice(0,4)]);
  const how={Sensitivity:`a ÷ (a + c) = ${a} ÷ ${a+c}`,Specificity:`d ÷ (b + d) = ${d} ÷ ${b+d}`,"Positive predictive value":`a ÷ (a + b) = ${a} ÷ ${a+b}`,"Negative predictive value":`d ÷ (c + d) = ${d} ÷ ${c+d}`}[ask];
  return {s:`A test is evaluated against a reference standard:<table><tr><th></th><th>Disease +</th><th>Disease −</th></tr><tr><th>Test +</th><td>${a}</td><td>${b}</td></tr><tr><th>Test −</th><td>${c}</td><td>${d}</td></tr></table>What is the <b>${ask.toLowerCase()}</b>?`,o:opts,a:opts.indexOf(right),e:`${ask} = ${how} = ${right}. The other options are the other measures from the same table: check which group each one starts from.`}},
 nnt(){const cer=[10,12,15,20,24,30][r(6)],red=[.2,.25,.3,.4,.5][r(5)],eer=+(cer*(1-red)).toFixed(1),arr=+(cer-eer).toFixed(1),nnt=Math.ceil(100/arr);
  const opts=shuffle([...new Set([String(nnt),String(Math.ceil(100/(red*100))),String(arr),String(Math.ceil(100/eer)),String(nnt*2)])]).slice(0,5);if(!opts.includes(String(nnt)))opts[0]=String(nnt);
  return {s:`In a trial, ${cer}% of the placebo group and ${eer}% of the treatment group had a stroke over 5 years. What is the number needed to treat to prevent one stroke over 5 years?`,o:opts,a:opts.indexOf(String(nnt)),e:`Absolute risk reduction = ${cer}% − ${eer}% = ${arr}%. NNT = 100 ÷ ${arr} = ${(100/arr).toFixed(1)}, rounded up to ${nnt}. A common trap is using the relative risk reduction (${red*100}%) instead.`}},
 abpi(){const ra=120+r(50),la=ra-r(12),arm=Math.max(ra,la),targ=[.42,.62,.71,.78,.85,1.05][r(6)],pt=Math.round(arm*targ),dp=pt-4-r(12),v=(pt/arm).toFixed(2);
  const cand=[v,(dp/arm).toFixed(2),(pt/Math.min(ra,la)).toFixed(2),(dp/Math.min(ra,la)).toFixed(2),(+v+0.08).toFixed(2),(+v-0.07).toFixed(2)];const opts=shuffle([...new Set(cand)].slice(0,5));
  return {s:`Arm systolic: right ${ra}, left ${la}. Left ankle: dorsalis pedis ${dp}, posterior tibial ${pt}. What is the left ABPI?`,o:opts,a:opts.indexOf(v),e:`ABPI = highest ankle ÷ highest arm = ${pt} ÷ ${arm} = ${v}. ${+v<0.5?"Below 0.5: severe disease.":+v<=0.9?"0.9 or less: PAD.":"Within the normal range."}`}},
 postural(){const ls=120+r(40),ld=70+r(15),pos=Math.random()<0.55,ss=pos?ls-(20+r(15)):ls-r(14),sd=pos?ld-r(8):ld-r(7),oh=(ls-ss)>=20||(ld-sd)>=10;
  const o=["Orthostatic hypotension","No orthostatic hypotension","Postural tachycardia syndrome","White-coat hypertension","Can't tell without a heart rate"];
  return {s:`Lying BP ${ls}/${ld}. Standing BP at 3 minutes ${ss}/${sd}. Heart rate rises by 8. What do these readings show?`,o,a:oh?0:1,e:`Fall of ${ls-ss}/${ld-sd}. Orthostatic hypotension is a systolic fall of 20 or more, or a diastolic fall of 10 or more, within 3 minutes of standing.`}}};
function r(n){return Math.floor(Math.random()*n)}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=r(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
async function buildBank(){const live=[];(typeof CATS!=="undefined"?CATS:[]).forEach(c=>{if(c.id==="sca")return;c.lessons.forEach(l=>{if(l[2]&&!/^https?:/.test(l[2]))live.push({cat:c.id,name:l[0],file:l[2]})})});
 const got=await Promise.all(live.map(async t=>{try{const h=await (await fetch(`../${t.cat}/${t.file}`)).text();const m=h.match(/const QS=(\[[\s\S]*?\]);\s*\n/);if(!m)return null;const QS=JSON.parse(m[1]);const h1=(h.match(/<h1>([^<]+)<\/h1>/)||[])[1];
  return {key:`${t.cat}/${t.file}`,name:h1?h1.replace(/&amp;/g,"&"):t.name,cat:t.cat,link:`../${t.cat}/${t.file}`,qs:QS.map((q,i)=>({id:`/${t.cat}/${t.file}#${i}`,s:q[0],o:q[1],a:q[2],e:q[3]}))}}catch(e){return null}}));
 TOPICS=got.filter(Boolean);
 const st={};const liveNames=new Set(TOPICS.map(t=>t.name));[...(typeof STATIC_BANK!=="undefined"?STATIC_BANK:[]),...(typeof DERM_BANK!=="undefined"?DERM_BANK:[])].filter(q=>!liveNames.has(q.topic)).forEach(q=>{(st[q.topic]=st[q.topic]||{key:"static/"+q.topic,name:q.topic,cat:q.cat,link:null,qs:[]}).qs.push({id:q.id,s:q.s,o:q.o,a:q.a,e:q.e})});
 TOPICS.push(...Object.values(st));
 /* private My bank (from sync / import), merged into a matching topic or its own */
 try{const mb=JSON.parse(localStorage.getItem("cgn-mybank")||"null");if(mb&&mb.q)Object.values(mb.q).forEach(q=>{let t=TOPICS.find(x=>x.name===q.topic);
  if(!t){t={key:"my/"+q.topic,name:q.topic,cat:"mybank",area:q.area,link:null,qs:[]};TOPICS.push(t)}
  t.qs.push({id:q.id,s:q.s,o:q.o,a:q.a,e:q.e,stars:q.stars,area:q.area})})}catch(e){}
 if(typeof CASES!=="undefined")Object.entries(CASES).forEach(([k,c])=>{let t=TOPICS.find(x=>x.name===c.topic);if(!t){t={key:"case/"+k,name:c.topic,cat:c.cat,link:c.lesson||null,qs:[]};TOPICS.push(t)}t.caseId=k;
  c.steps.forEach((q,i)=>t.qs.push({id:`case-${k}#${i}`,s:q.solo||q.s,o:q.o,a:q.a,e:q.e}))});
 TOPICS.push({key:"calc",name:"Calculations (new numbers every time)",cat:"calc",link:null,gen:true,qs:Object.keys(GEN).map(k=>({id:"gen-"+k,gen:k}))});
 const order=["cardiology","dermatology","statistics","admin","prescribing","mybank","calc"];TOPICS.sort((a,b)=>order.indexOf(a.cat)-order.indexOf(b.cat));
 BANK=TOPICS.flatMap(t=>t.qs.map(q=>Object.assign(q,{topic:t.name,cat:t.cat,link:t.link})))}
const real=q=>q.gen?Object.assign({},q,GEN[q.gen]()):q;

function topicStats(d){const m={};TOPICS.forEach(t=>{const l=d.log.filter(x=>x.theme===t.name).slice(-10);m[t.name]={p:l.length?Math.round(l.filter(x=>x.ok).length/l.length*100):null,n:d.log.filter(x=>x.theme===t.name).length,due:t.qs.filter(q=>d.q[q.id]&&d.q[q.id].due<=Date.now()).length}});return m}

/* ---------------- home ---------------- */
let selTopics=new Set();
const TV_KEY="rtg-akt-view";let TV={area:"all",status:"all",sort:"yield",q:""},tShown=12;try{TV=Object.assign(TV,JSON.parse(localStorage.getItem(TV_KEY))||{});TV.q=""}catch(e){}
function topicSection(ts){
 const AREA={cardiology:"Cardiology",dermatology:"Dermatology",statistics:"Statistics",admin:"Admin",prescribing:"Prescribing",mybank:"My bank",calc:"Calculations"};
 const yieldOf=t=>{try{if(t.cat==="calc")return 5;const cat=(CATS||[]).find(x=>x.id===t.cat);const f=(t.link||"").split("/").pop();const l=cat&&cat.lessons.find(x=>x[2]===f||x[0]===t.name);return l&&l[3]||0}catch(e){return 0}};
 const items=TOPICS.map((t,i)=>({t,i,s:ts[t.name],y:yieldOf(t)})).filter(({t})=>t.gen?(SET.src==="all"||SET.src==="site"):t.qs.some(inSrc));
 const areas=[...new Set(items.map(x=>x.t.cat))];
 if(TV.area!=="all"&&!areas.includes(TV.area))TV.area="all";
 const save=()=>{try{localStorage.setItem(TV_KEY,JSON.stringify({area:TV.area,status:TV.status,sort:TV.sort}))}catch(e){}};
 $("tsec").innerHTML=`<div class="tp-tools"><div class="tp-chips" role="group" aria-label="Area">
  ${[["all","All",items.length,""],...areas.map(a=>[a,AREA[a]||a,items.filter(x=>x.t.cat===a).length,COLORS[a]||"#888"])].map(([v,l,n,c])=>`<button class="tp-chip" data-ta="${v}" aria-pressed="${TV.area===v}">${c?`<i style="background:${c}"></i>`:""}${esc(l)} <span>${n}</span></button>`).join("")}</div>
  <div class="tp-row"><input id="tq" type="search" placeholder="Search topics" aria-label="Search topics" value="${esc(TV.q)}">
  <select id="tst" aria-label="Show"><option value="all">All topics</option><option value="due">Due for review</option><option value="weak">Weak (under 60%)</option><option value="new">Not started</option><option value="mast">Strong (80%+)</option></select>
  <select id="tso" aria-label="Sort"><option value="yield">Highest yield</option><option value="weak">Weakest first</option><option value="due">Most due</option><option value="az">A to Z</option></select></div>
  <div id="tsel"></div></div><div id="tlist"></div>`;
 $("tst").value=TV.status;$("tso").value=TV.sort;
 const selBar=()=>{$("tsel").innerHTML=selTopics.size?`<div class="tp-sel"><span><b>${selTopics.size}</b> topic${selTopics.size>1?"s":""} selected</span><span class="row" style="margin:0"><button class="btn ghost" id="tclr">Clear</button><button class="btn" id="tqf">Quick-fire these</button></span></div>`:"";
  if($("tclr"))$("tclr").onclick=()=>{selTopics.clear();selBar();draw()};if($("tqf"))$("tqf").onclick=()=>$("m-quick").click()};
 function draw(){
  const q=TV.q.trim().toLowerCase(),pv=x=>x.s.p===null?-1:x.s.p;
  let L=items.filter(x=>(TV.area==="all"||x.t.cat===TV.area)&&(!q||(x.t.name+" "+(AREA[x.t.cat]||"")).toLowerCase().includes(q))&&
   (TV.status==="all"||(TV.status==="due"&&x.s.due>0)||(TV.status==="weak"&&x.s.p!==null&&x.s.p<60)||(TV.status==="new"&&!x.s.n)||(TV.status==="mast"&&x.s.p!==null&&x.s.p>=80)));
  const byY=(a,b)=>b.y-a.y||a.t.name.localeCompare(b.t.name);
  L.sort(TV.sort==="az"?(a,b)=>a.t.name.localeCompare(b.t.name):TV.sort==="weak"?(a,b)=>((a.s.p===null)-(b.s.p===null))||pv(a)-pv(b)||byY(a,b):TV.sort==="due"?(a,b)=>(b.s.due||0)-(a.s.due||0)||byY(a,b):byY);
  const vis=L.slice(0,tShown);
  $("tlist").innerHTML=!L.length?`<div class="card tp-empty">No topics match. <button class="btn ghost" id="tres" style="margin-left:8px">Clear filters</button></div>`:
   `<div class="tp-list">${vis.map(({t,i,s,y})=>{const p=s.p,c=p===null?"var(--line)":p>=80?"var(--teal)":p>=60?"var(--amber)":"var(--red)";
    const f=t.qs.filter(q=>q.stars===5).length,th=t.qs.filter(q=>q.stars===3).length;
    return `<div class="tp-item${selTopics.has(i)?" on":""}"><i style="background:${COLORS[t.cat]||"#888"}"></i><input type="checkbox" data-sel="${i}" aria-label="Select ${esc(t.name)}" ${selTopics.has(i)?"checked":""}>
    <div><b title="${esc(t.name)}">${esc(t.name)}</b><div class="tp-meta"><span>${t.gen?"endless":t.qs.length+" questions"} · ${s.n} done</span>${s.due?`<span class="tp-due">${s.due} due</span>`:""}${y&&t.cat!=="calc"?`<span class="tp-st" aria-label="AKT relevance ${y} of 5">${"★".repeat(y)}<i>${"☆".repeat(5-y)}</i></span>`:""}${f?`<span class="stb">★5 ${f}</span>`:""}${th?`<span class="stb s3">★3 ${th}</span>`:""}${t.link?`<a href="${esc(t.link)}">lesson</a>`:""}${t.caseId?`<a href="case.html#${t.caseId}">case</a>`:""}</div>
    <div class="tp-m"><div class="mbar"><div style="width:${p||0}%;background:${c}"></div></div><b style="color:${c}">${p===null?"–":p+"%"}</b></div></div>
    <button class="go" data-go="${i}">Practise</button></div>`}).join("")}</div>
   <div class="tp-more"><span class="note">Showing ${vis.length} of ${L.length}</span>${L.length>tShown?`<button class="btn ghost" id="tmore">Show ${Math.min(12,L.length-tShown)} more</button>`:""}</div>`;
  if($("tmore"))$("tmore").onclick=()=>{tShown+=12;draw()};
  if($("tres"))$("tres").onclick=()=>{TV.area="all";TV.status="all";TV.q="";$("tq").value="";$("tst").value="all";document.querySelectorAll("[data-ta]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.ta==="all"));tShown=12;save();draw()};
  document.querySelectorAll("[data-sel]").forEach(c=>c.onchange=()=>{const i=+c.dataset.sel;c.checked?selTopics.add(i):selTopics.delete(i);c.closest(".tp-item").classList.toggle("on",c.checked);selBar()});
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const t=TOPICS[+b.dataset.go];start(t.name,t.gen?Array.from({length:20},(_,i)=>t.qs[i%t.qs.length]).sort(()=>Math.random()-.5):pickQuick(t.qs.filter(inSrc),t.qs.length),t.gen?{endless:true}:{})});
 }
 document.querySelectorAll("[data-ta]").forEach(b=>b.onclick=()=>{TV.area=b.dataset.ta;document.querySelectorAll("[data-ta]").forEach(x=>x.setAttribute("aria-pressed",x===b));tShown=12;save();draw()});
 $("tq").oninput=e=>{TV.q=e.target.value;tShown=12;draw()};
 $("tst").onchange=e=>{TV.status=e.target.value;tShown=12;save();draw()};
 $("tso").onchange=e=>{TV.sort=e.target.value;tShown=12;save();draw()};
 selBar();draw()}
function home(){stopTimers();document.onkeydown=null;const d=load(),ts=topicStats(d),now=Date.now();
 const due=BANK.filter(q=>d.q[q.id]&&d.q[q.id].due<=now).length,today=d.log.filter(x=>new Date(x.t).toDateString()===new Date().toDateString()).length;
 const last=d.log.slice(-100),acc=last.length?Math.round(last.filter(x=>x.ok).length/last.length*100):null,mis=mistakes(d).length;
 const real_n=BANK.filter(q=>!q.gen).length;
 $("app").innerHTML=`<h1>AKT practice</h1><p class="sub">Free, fast repetition at exam pace: one minute a question. ${real_n} questions from your notes, plus calculations with new numbers every time.</p>
 <div class="kpis"><div class="kpi"><b>${due}</b><span>due for review</span></div><div class="kpi"><b>${today}</b><span>answered today${streak(d)>1?` · ${streak(d)}-day streak`:""}</span></div><div class="kpi"><b>${acc===null?"–":acc+"%"}</b><span>accuracy, last 100</span></div><div class="kpi"><b>${BANK.filter(q=>d.q[q.id]&&d.q[q.id].box>=4).length}</b><span>mastered</span></div></div>
 <div class="modes">
  <button class="mode r" id="m-daily"><b>Daily review</b><span>20 questions: overdue first, then your weakest topics, then new.</span></button>
  <button class="mode" id="m-quick"><b>Quick-fire</b><span>Tick topics below (or none for a mix), then go. Instant feedback.</span></button>
  <button class="mode a" id="m-mock"><b>Mock exam</b><span>Timed, mixed, no feedback until the end. 1 minute per question.</span></button>
  <a class="mode" style="border-top-color:#7b46c7;text-decoration:none" href="case.html"><b>Cases</b><span>Short patient stories: gather clues, decide, see what happens. ${typeof CASES!=="undefined"?Object.keys(CASES).length:0} so far.</span></a>
  <button class="mode t" id="m-calc"><b>Calculation drill</b><span>Endless stats, ABPI and postural BP with new numbers.</span></button>
 </div>
 <div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Settings</h2>${mis?`<button class="btn ghost" id="m-miss">Retry my mistakes (${mis})</button>`:""}</div>
 <div style="margin-top:8px"><div class="note" style="margin:0 0 6px">Questions to use</div><div class="row" role="group" aria-label="Questions to use">${["all","5","3","site","mine"].map(k=>{const n=BANK.filter(q=>!q.gen&&(k==="all"||(k==="5"?q.stars===5:k==="3"?q.stars===3:k==="site"?!q.stars:!!q.stars))).length;return (k==="all"||k==="site"||n)?`<button class="srcb ${SET.src===k?"on":""}" data-src="${k}">${SRC_LABEL[k]} <small>${n}</small></button>`:""}).join("")}</div></div>
 <div class="set" style="margin-top:8px"><label><input type="checkbox" id="s-recall" ${SET.recall?"checked":""}> <span><b>Recall first</b>: think of your answer before the options appear</span></label><label><input type="checkbox" id="s-pace" ${SET.pace?"checked":""}> <span><b>Pace bar</b>: 60 seconds per question</span></label></div></div>
 <h2 style="margin:22px 0 0">Topics</h2><div id="tsec"></div>
 <p class="note">Progress is saved in this browser. Your lesson quizzes count towards it too. <a href="#" id="reset">Reset progress</a></p>`;
 $("m-daily").onclick=()=>start("Daily review",pickDaily(20));
 $("m-quick").onclick=()=>{const qs=(selTopics.size?[...selTopics].flatMap(i=>TOPICS[i].qs):BANK.filter(q=>!q.gen)).filter(inSrc);start("Quick-fire",pickQuick(qs,20))};
 $("m-mock").onclick=mockSetup;$("m-calc").onclick=()=>start("Calculation drill",Array.from({length:20},(_,i)=>TOPICS.find(t=>t.gen).qs[i%4]).sort(()=>Math.random()-.5),{endless:true});
 if($("m-miss"))$("m-miss").onclick=()=>start("Mistakes",shuffle(mistakes(load())).slice(0,20));
 $("s-recall").onchange=e=>{SET.recall=e.target.checked;saveSet()};document.querySelectorAll("[data-src]").forEach(b=>b.onclick=()=>{SET.src=b.dataset.src;saveSet();home()});$("s-pace").onchange=e=>{SET.pace=e.target.checked;saveSet()};
 topicSection(ts);
 $("reset").onclick=e=>{e.preventDefault();if(confirm("Reset all your AKT progress in this browser?")){try{localStorage.removeItem(KEY)}catch(x){}home()}}}
function pickDaily(n){const d=load(),now=Date.now(),ts=topicStats(d),w=q=>{const p=ts[q.topic]&&ts[q.topic].p;return p===null||p===undefined?50:p};
 const pool=BANK.filter(q=>!q.gen&&inSrc(q));const due=pool.filter(q=>d.q[q.id]&&d.q[q.id].due<=now).sort((a,b)=>w(a)-w(b));
 const fresh=shuffle(pool.filter(q=>!d.q[q.id])).sort((a,b)=>w(a)-w(b));const later=pool.filter(q=>d.q[q.id]&&d.q[q.id].due>now).sort((a,b)=>d.q[a.id].due-d.q[b.id].due);
 const out=[...due,...fresh.slice(0,Math.max(0,n-due.length-2)),...later];const calc=TOPICS.find(t=>t.gen).qs;if(SET.src==="all"||SET.src==="site"){out.splice(Math.min(out.length,7),0,calc[r(4)]);out.splice(Math.min(out.length,15),0,calc[r(4)])}
 return [...new Set(out)].slice(0,n)}
function pickQuick(qs,n){const d=load(),now=Date.now();return shuffle(qs.slice()).sort((a,b)=>{const da=d.q[a.id],db=d.q[b.id];const sa=!da?1:da.due<=now?0:2,sb=!db?1:db.due<=now?0:2;return sa-sb}).slice(0,n)}

/* ---------------- session ---------------- */
let S=null,paceT=null,mockT=null;
function stopTimers(){clearInterval(paceT);clearInterval(mockT)}
function start(title,qs,opt={}){if(!qs.length){alert("No questions here yet.");return}S={title,qs:qs.map(real),i:0,ans:[],t0:Date.now(),endless:!!opt.endless,mock:!!opt.mock,flags:new Set(),qt:Date.now()};
 if(S.mock){S.end=Date.now()+S.qs.length*60000;mockT=setInterval(mockTick,1000)}show()}
function record(q,ok,ms){const d=load(),c=d.q[q.id]||{box:0,due:0,n:0,ok:0};c.n++;if(ok){c.ok++;c.box=Math.min(GAPS.length-1,c.box+1);c.due=Date.now()+GAPS[c.box]*DAY}else{c.box=0;c.due=Date.now()+10*60000}d.q[q.id]=c;
 d.log.push(Object.assign({t:Date.now(),theme:q.topic,ok,id:q.id,ms},SET.recall&&!S.mock?{r:1}:{}));if(d.log.length>5000)d.log=d.log.slice(-5000);save(d);return c}
function show(){stopTimers();if(S.mock)mockT=setInterval(mockTick,1000);const q=S.qs[S.i],ans=S.ans[S.i],done=ans!==undefined&&!S.mock;S.qt=Date.now();
 const hidden=SET.recall&&ans===undefined&&!S.mock&&!S.revealed;
 $("app").innerHTML=`<div class="qbar"><span><b>${esc(S.title)}</b> · ${S.endless?`${S.i+1}`:`${S.i+1} of ${S.qs.length}`}${S.mock?"":` · ${S.ans.filter((a,i)=>a===S.qs[i].a).length} right`}</span><span>${S.mock?`<b id="mclk"></b> left · `:""}<a href="#" id="quit">${S.mock?"Finish":"Stop"}</a></span></div>
 <div class="prog"><div style="width:${S.endless?100:(S.i/S.qs.length*100)}%"></div></div>${SET.pace&&!S.mock?`<div class="pace"><div id="pace" style="width:100%"></div></div>`:""}
 <div class="card"><span class="tag" style="border-color:${COLORS[q.cat]||"var(--line)"}">${esc(q.topic)}</span><div class="stem">${q.s}</div>
 ${hidden?`<div class="recall" id="recall"><b>What's your answer?</b> Think it through first.<input id="rin" placeholder="Optional: jot your answer here" aria-label="Your answer"><button class="btn" id="reveal">Show options</button><div class="keys">or press <kbd>Space</kbd></div></div>`:
 `<div class="opts">${q.o.map((o,k)=>`<button class="opt${S.mock&&ans===k?" pick":""}${done?(k===q.a?" right":k===ans?" wrong":""):""}" data-k="${k}" ${done?"disabled":""}><span class="k">${L[k]}</span><span>${esc(o)}</span></button>`).join("")}</div>`}
 ${done?`<div class="fb ${ans===q.a?"ok":"no"}"><b>${ans===q.a?"Correct.":"Not quite: the answer is "+L[q.a]+"."}</b>${esc(q.e)}${q.link?` <a href="${esc(q.link)}">Open the lesson</a>`:""}<div class="note" style="margin-top:6px">${S.nextNote||""}</div></div>`:""}
 ${S.mock?`<div class="row" style="margin-top:12px;justify-content:space-between"><span class="row"><button class="btn ghost" id="prev" ${S.i?"":"disabled"}>← Previous</button><button class="btn ghost" id="flag">${S.flags.has(S.i)?"Unflag":"Flag"}</button></span><button class="btn" id="nx">${S.i<S.qs.length-1?"Next →":"Finish mock"}</button></div><div class="grid-nav">${S.qs.map((x,i)=>`<button data-j="${i}" class="${S.ans[i]!==undefined?"a":""} ${i===S.i?"cur":""} ${S.flags.has(i)?"f":""}">${i+1}</button>`).join("")}</div>`:
 done?`<div class="row" style="margin-top:12px;justify-content:flex-end"><button class="btn" id="nx">${!S.endless&&S.i===S.qs.length-1?"See results":"Next question →"}</button></div>`:""}
 <div class="keys">Keys: <kbd>A</kbd>–<kbd>E</kbd> or <kbd>1</kbd>–<kbd>5</kbd> to answer${S.mock?"":", <kbd>Enter</kbd> for next"}</div></div>`;
 $("quit").onclick=e=>{e.preventDefault();S.mock?finishMock():results()};
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
 if($("reveal"))$("reveal").onclick=reveal;if($("nx"))$("nx").onclick=next;if($("prev"))$("prev").onclick=()=>{S.i--;show()};
 if($("flag"))$("flag").onclick=()=>{S.flags.has(S.i)?S.flags.delete(S.i):S.flags.add(S.i);show()};
 document.querySelectorAll("[data-j]").forEach(b=>b.onclick=()=>{S.i=+b.dataset.j;show()});
 document.onkeydown=e=>{if(e.target.tagName==="INPUT"){if(e.key==="Enter")reveal();return}const k=e.key.toUpperCase();
  if(hidden&&(e.key===" "||e.key==="Enter")){e.preventDefault();reveal();return}
  let n="ABCDE".indexOf(k);if(n<0&&/^[1-5]$/.test(e.key))n=+e.key-1;if(n>=0&&n<q.o.length&&!done&&!hidden){pick(n);return}
  if(e.key==="Enter"&&(done||S.mock)){e.preventDefault();next()}};
 if(SET.pace&&!S.mock&&!done){const p=$("pace"),t0=Date.now();paceT=setInterval(()=>{const left=Math.max(0,60-(Date.now()-t0)/1000);if(p){p.style.width=left/60*100+"%";p.style.background=left<10?"var(--red)":left<25?"var(--amber)":"var(--teal)"}},250)}
 if(S.mock)mockTick()}
function reveal(){S.revealed=true;show()}
function pick(k){const q=S.qs[S.i];if(S.mock){S.ans[S.i]=k;show();return}if(S.ans[S.i]!==undefined)return;S.ans[S.i]=k;const ok=k===q.a;const c=record(q,ok,Date.now()-S.qt);
 const g=GAPS[c.box];S.nextNote=q.gen?"":ok?`You'll see this again ${g===1?"tomorrow":`in ${g} days`}.`:"You'll see this again later today.";S.revealed=false;show()}
function next(){S.revealed=false;if(S.mock){if(S.i<S.qs.length-1){S.i++;show()}else finishMock();return}
 if(S.endless&&S.i===S.qs.length-1){const calc=TOPICS.find(t=>t.gen).qs;S.qs.push(...Array.from({length:10},()=>real(calc[r(4)])))}
 if(S.i<S.qs.length-1){S.i++;show()}else results()}
function results(){stopTimers();document.onkeydown=null;const n=S.ans.filter(a=>a!==undefined).length,right=S.ans.filter((a,i)=>a===S.qs[i].a).length,secs=Math.round((Date.now()-S.t0)/1000);
 if(!n){home();return}
 const byT={};S.qs.forEach((q,i)=>{if(S.ans[i]===undefined)return;(byT[q.topic]=byT[q.topic]||[0,0]);byT[q.topic][1]++;if(S.ans[i]===q.a)byT[q.topic][0]++});
 $("app").innerHTML=`<h1>${esc(S.title)}: done</h1><div class="card"><div class="row" style="gap:24px;align-items:flex-end"><div><div class="big" style="color:${right/n>=.7?"var(--teal)":right/n>=.5?"var(--amber)":"var(--red)"}">${right}/${n}</div><div class="note">${Math.round(right/n*100)}% correct</div></div><div><b>${Math.round(secs/n)} s</b><div class="note">average per question (exam pace 60 s)</div></div></div>
 <h2 style="margin-top:14px">By topic</h2>${Object.entries(byT).map(([t,[a,b]])=>`<div class="row" style="justify-content:space-between;border-bottom:1px solid var(--line);padding:6px 0"><span>${esc(t)}</span><b style="color:${a/b>=.7?"var(--teal)":a/b>=.5?"var(--amber)":"var(--red)"}">${a}/${b}</b></div>`).join("")}
 <div class="row" style="margin-top:14px"><button class="btn" id="again">Another 20</button><button class="btn ghost" id="hm">Back to AKT practice</button></div></div>
 ${reviewList()}`;
 $("again").onclick=()=>start("Daily review",pickDaily(20));$("hm").onclick=home}
function reviewList(){const wrong=S.qs.map((q,i)=>[q,i]).filter(([q,i])=>S.ans[i]!==undefined&&S.ans[i]!==q.a);if(!wrong.length)return"";
 return `<div class="card"><h2>Review your wrong answers</h2><div class="rev">${wrong.map(([q,i])=>`<details><summary>${esc(q.topic)}: <span class="w">${S.ans[i]<0?"not answered":"you chose "+L[S.ans[i]]}</span>, <span class="c">answer ${L[q.a]}</span></summary><div class="stem" style="font-size:16px">${q.s}</div><p><b>${L[q.a]}. ${esc(q.o[q.a])}</b><br>${esc(q.e)}</p></details>`).join("")}</div></div>`}
/* mock */
function mockSetup(){const pool=BANK.filter(q=>!q.gen&&inSrc(q)).length;
 $("app").innerHTML=`<h1>Mock exam</h1><div class="card"><p style="margin-top:0">Mixed questions from all your topics, timed at the real AKT pace of 1 minute per question. No feedback until you finish; you can flag questions and go back.</p>
 <div class="row">${[20,40,80,160].map(n=>`<button class="btn ${n===40?"":"ghost"}" data-n="${n}" ${n>pool?"disabled":""}>${n} questions · ${n} min</button>`).join("")}</div>
 <p class="note">You have ${pool} questions so far${pool<160?", so the full 160-question mock unlocks as you add topics":""}.</p><button class="btn ghost" id="hm">Back</button></div>`;
 document.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>start("Mock exam",shuffle(BANK.filter(q=>!q.gen&&inSrc(q))).slice(0,+b.dataset.n),{mock:true}));$("hm").onclick=home}
function mockTick(){const left=Math.max(0,Math.round((S.end-Date.now())/1000)),el=$("mclk");if(el){el.textContent=`${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}`;el.style.color=left<300?"var(--red)":""}if(left<=0)finishMock()}
function finishMock(){stopTimers();S.qs.forEach((q,i)=>{if(S.ans[i]!==undefined)record(q,S.ans[i]===q.a,0)});try{const d=load();d.mocks=d.mocks||[];d.mocks.push({t:Date.now(),q:S.qs.length,c:S.qs.filter((q,i)=>S.ans[i]===q.a).length,mins:Math.round((Date.now()-S.t0)/60000)});save(d)}catch(e){}S.mock=false;const unanswered=S.qs.length-S.ans.filter(a=>a!==undefined).length;
 S.ans=S.qs.map((q,i)=>S.ans[i]===undefined?-1:S.ans[i]);results();if(unanswered)$("app").insertAdjacentHTML("afterbegin",`<p class="note">${unanswered} unanswered question${unanswered>1?"s":""} counted as wrong.</p>`)}

buildBank().then(home).catch(()=>{$("app").innerHTML=`<p>Couldn't load the questions. Please refresh.</p>`});
}
</script>
